[project]
name = "czefootball-player-pool-atlas"
version = "0.1.0"
description = "Position-normalized atlas of Czech-eligible professional football players. Methodology showcase, not selection recommendation."
authors = [{ name = "Barbora Sandova", email = "barbora@datasimply.eu" }]
requires-python = ">=3.11"
license = { text = "MIT" }
readme = "README.md"

dependencies = [
  "pandas>=2.2", "pyarrow>=16", "numpy>=1.26", "scikit-learn>=1.5",
  "matplotlib>=3.9", "jinja2>=3.1", "pyyaml>=6", "requests>=2.32",
  "beautifulsoup4>=4.12", "lxml>=5", "soccerdata>=1.9,<2", "unidecode>=1.3",
]

[project.optional-dependencies]
dev = ["pytest>=8", "ruff>=0.5"]

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["src"]

[tool.ruff]
line-length = 100
target-version = "py311"

[tool.ruff.lint]
select = ["E", "F", "I", "B", "UP", "N", "W"]
ignore = ["E501"]

[tool.pytest.ini_options]
testpaths = ["tests"]
python_files = ["test_*.py"]
addopts = "-q --tb=short"
