# "This autumn" (report section #autumn): dated news beside the atlas's
# frozen data. The atlas data is NOT refreshed for it -- every number the
# section shows is computed from the snapshot (pool_table.json, squad_lens),
# and only the dated facts below come from outside.
#
# Only facts graded "confirmed by an official source" or "confirmed by
# reputable media only" in the news review of 29 September 2026 are here;
# ungraded or "not confirmed" items are left out, among them the September
# 2026 squad list itself (read only from Wikipedia's transcription of the
# FAČR nomination), so no squad composition is drawn from it. A source is
# cited only if it was read; `date` is its publication date where the review
# recorded one, null otherwise (rendered "n.d.").
#
# Wording rules: a retirement is the player's own announcement, not a
# selection decision; no evaluation of the coach's choices.
#
# A nation without a file here gets no section (src.render._build_this_autumn).

data_as_of: 2026-09-14
news_as_of: 2026-09-29

sources:
