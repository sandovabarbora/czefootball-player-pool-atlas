# Announced retirements from the national team, in date order. `quote` is at
# most one short phrase, verbatim from the cited source, with its English
# gloss; left out when the source only paraphrases the player.
# `retirements_sources` back the section's own line that all three retired
# before the first squad under the new coach.
retirements_sources: [isport_cerny]
retirements:
