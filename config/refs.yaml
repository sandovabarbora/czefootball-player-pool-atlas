# Harvard-style reference list (Task 15). Every entry was verified before
# being added: `curl -sI https://doi.org/<doi>` returned a 30x for every
# `doi` below; every `url` (no-DOI entries) returned a 200. See
# task-15-report.md for the verification log. `src/references.py` renders
# these; do not hand-format a citation elsewhere.
#
# Fields: key, authors (list, "Last, F.M." form), et_al (optional, true when
# the source names more authors than are worth spelling out -- the rendered
# citation becomes "First author et al."), year, title, and either
# (container, volume, issue, pages) for a journal article, or
# (type: book, edition, place, publisher) for a book, or
# (type: report, series, number, accessed) for an online report -- plus doi
# and/or url on every entry.

