source: ClubElo unavailable at run time (HTTP error); fell back to Wikipedia's UEFA
  men's association coefficient, current 5-year ranking (2022–23–2026–27 seasons).
  tier-1 multiplier = coef[country] / max(coef); tier-2 multiplier = 0.6 * tier-1
  multiplier of the same country (stated assumption, not derived from data). Strongest
  tier-1 country = 1.00.
method: uefa_coefficient
tier2_factor: 0.6
