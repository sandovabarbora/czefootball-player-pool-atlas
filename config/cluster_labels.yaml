# Tactical reads (style projection only), written from the 2025/26 cluster
# medians — the author edits these. Descriptive: what the statistical
# footprint is consistent with, never what a coach should do. Czech examples
# are the Czech-eligible players with the most 2025/26 minutes in the cluster.
tactical:
  FW:
    C0:
      en: "Every-week starters — three quarters of the season's minutes, assist rate about 1.5 times the forward median, scoring at median. Mostly a top-five-league footprint: the first-choice forward who links play as much as he finishes (Kušej)."
      cs: "Každotýdenní startující — tři čtvrtiny minut sezóny, asistenční podíl zhruba 1,5násobek mediánu útočníků, střelecky na mediánu. Převážně otisk pěti nejsilnějších lig: útočník první volby, který hru spojuje stejně jako zakončuje (Kušej)."
    C1:
      en: "Primary scorers — non-penalty goal rate nearly double the forward median on starter minutes (56 %). The finishing forward of a first-choice line (Schick, Patrák, Chorý, Kuchta)."
      cs: "Hlavní střelci — podíl gólů ze hry skoro dvojnásobný oproti mediánu útočníků při startovací minutáži (56 %). Zakončující útočník první volby (Schick, Patrák, Chorý, Kuchta)."
    C2:
      en: "Experienced forwards on managed minutes — median age 31, about 40 % of minutes, output at median. The impact or target forward used in rotation (Chramosta, Poznar, Jurečka, Pilař)."
      cs: "Zkušení útočníci s řízenou minutáží — medián věku 31, zhruba 40 % minut, produkce na mediánu. Impaktový nebo cílový útočník v rotaci (Chramosta, Poznar, Jurečka, Pilař)."
    C3:
      en: "Rotation forwards whose signature is physical engagement — card rate roughly three times the forward median, a third of minutes, output at median. Pressing and duel-heavy roles rather than finishing (Mašek, Pulkrab, Vojta)."
      cs: "Rotační útočníci, jejichž podpisem je fyzický souboj — kartový podíl zhruba trojnásobný oproti mediánu útočníků, třetina minut, produkce průměrná. Presink a souboje spíš než zakončení (Mašek, Pulkrab, Vojta)."
    C4:
      en: "The development tier and the largest forward cluster — median age 23, under 30 % of minutes, output just below median. Where most young Czech forwards sit (Zlatohlávek, Juroška, Čvančara)."
      cs: "Rozvojová vrstva a největší cluster útočníků — medián věku 23, pod 30 % minut, produkce těsně pod mediánem. Tady sedí většina mladých českých útočníků (Zlatohlávek, Juroška, Čvančara)."
  MF:
    C0:
      en: "Starting playmakers — assist rate three times the midfield median on 62 % of minutes, scoring nearly double. The creative hub of the middle third (Provod, Vlkanova, Ladra, Černý)."
      cs: "Startující tvůrci hry — asistenční podíl trojnásobný oproti mediánu záložníků při 62 % minut, střelecky skoro dvojnásobní. Kreativní centrum střední třetiny (Provod, Vlkanova, Ladra, Černý)."
    C1:
      en: "Veteran rotation midfielders — median age 30 on managed minutes (40 %), output at median, card rate above it. Experience kept in the squad rather than on the pitch every week (Souček, Trávník, Daníček, Zorvan)."
      cs: "Veteránští rotační záložníci — medián věku 30 při řízené minutáži (40 %), produkce průměrná, kartový podíl nad ní. Zkušenost držená v kádru spíš než na hřišti každý týden (Souček, Trávník, Daníček, Zorvan)."
    C2:
      en: "Development midfielders — the largest Czech midfield group: median age 22, under a third of minutes, output at median. The pipeline's waiting room (Daněk, Křišťan, Mikulenka, Sojka)."
      cs: "Rozvojoví záložníci — největší česká záložnická skupina: medián věku 22, pod třetinu minut, produkce na mediánu. Čekárna pipeline (Daněk, Křišťan, Mikulenka, Sojka)."
    C3:
      en: "Ball-winning, duel-heavy midfielders — the card rate (about 2.5 times the midfield median) is the defining feature, production at the floor of the group. The destroyer profile, often in a double pivot (Ryneš, Langhamer, Smrž)."
      cs: "Záložníci na zisk míče a souboje — kartový podíl (zhruba 2,5násobek mediánu záložníků) je určující znak, produkce na dně skupiny. Profil „ničitele“, často ve dvojici před obranou (Ryneš, Langhamer, Smrž)."
    C4:
      en: "The engine room — nearly 80 % of minutes with median output: holding and box-to-box midfielders whose value is continuity and structure, not numbers (Hellebrand, Horák, Čermák, Červ)."
      cs: "Motor týmu — skoro 80 % minut při průměrné produkci: defenzivní a box-to-box záložníci, jejichž hodnota je kontinuita a struktura, ne čísla (Hellebrand, Horák, Čermák, Červ)."
    C5:
      en: "Goal-scoring attacking midfielders — non-penalty goal rate three times the midfield median on starter minutes (56 %). The number 8/10 who arrives in the box (Darida, Ševčík, Višinský, Mareček)."
      cs: "Střílející ofenzivní záložníci — podíl gólů ze hry trojnásobný oproti mediánu záložníků při startovací minutáži (56 %). Osmička/desítka, která dobíhá do vápna (Darida, Ševčík, Višinský, Mareček)."
  DF:
    C0:
      en: "Set-piece threats — defenders scoring at five times the DF median on 60 % of minutes. Aerial presence in both boxes (Chaloupek, Bořil, Lischka)."
      cs: "Hrozby ze standardek — obránci střílející pětinásobek mediánu obránců při 60 % minut. Přítomnost ve vzduchu v obou vápnech (Chaloupek, Bořil, Lischka)."
    C1:
      en: "Attacking full-backs — assist rate seven times the DF median on starter minutes (65 %). The wide defender whose job ends in the final third (Coufal, Icha, Hadaš, Zelený)."
      cs: "Ofenzivní krajní obránci — asistenční podíl sedminásobný oproti mediánu obránců při startovací minutáži (65 %). Krajní obránce, jehož práce končí v útočné třetině (Coufal, Icha, Hadaš, Zelený)."
    C2:
      en: "Experienced defenders on managed minutes — median age 31, 44 % of minutes, output at the floor. Leadership and cover rather than a starting role (Novák, Brabec, Fleišman, Holeš)."
      cs: "Zkušení obránci s řízenou minutáží — medián věku 31, 44 % minut, produkce na dně. Vedení a krytí spíš než startovací role (Novák, Brabec, Fleišman, Holeš)."
    C3:
      en: "The defensive core — 85 % of minutes, output at the DF floor. Availability and continuity are the signal; production is not (Hůlka, Halinský, Cedidla, Chlumecký)."
      cs: "Obranné jádro — 85 % minut, produkce na dně skupiny. Signálem je dostupnost a kontinuita, ne čísla (Hůlka, Halinský, Cedidla, Chlumecký)."
    C4:
      en: "Development defenders — median age 22, about a third of minutes, output at the floor. The tier the 23–25 cohort draws from (Konečný, Kolář, Prebsl)."
      cs: "Rozvojoví obránci — medián věku 22, zhruba třetina minut, produkce na dně. Vrstva, ze které kohorta 23–25 čerpá (Konečný, Kolář, Prebsl)."
    C5:
      en: "Duel-heavy defenders — card rate 2.5 times the DF median with rotation minutes (46 %). The physical stopper profile (Pojezný, Chaluš, Čihák)."
      cs: "Soubojoví obránci — kartový podíl 2,5násobek mediánu obránců při rotační minutáži (46 %). Profil fyzického stopera (Pojezný, Chaluš, Čihák)."
