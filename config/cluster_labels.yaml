# Descriptive (non-evaluative) labels per (position group, projection,
# cluster), written after inspecting `data/processed/cluster_summary.parquet`
# medians for npg_p90_quality, ast_p90_quality, min_share, age, cards_p90.
# Each label line carries an inline comment: n and the 3 most common leagues,
# for controller review of label sanity. These are descriptive reads only --
# no selection-recommendation language, no "tactical reads" (those come
# later from the author).

