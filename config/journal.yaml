# Change log: newest first. `nations` limits an entry to some editions
# (codes as in config/nations/*.yaml); without it an entry is on every edition.
changelog:
  - date: '2026-10-01'
    items:
    - 'Each edition''s own series model (the Big-5 page, its forecast and backtest, and the first finding on the Nations page) was refitted under a convergence rule written down on 1 October 2026, before the refit (design/edition-refit-protocol.md): four chains, 2000 tuning steps and 2000 draws, target acceptance 0.99 only where 0.95 failed; max R-hat at most 1.01, bulk and tail ESS at least 400, no divergent transitions. At the earlier settings (two chains, 500 draws) no edition''s fit met it. Now every fit passes: the six home fits, the peers'' fits, the forecast fits and every backtest origin.'
    - 'What moved: England''s fall, dated 2007/08 at ×0.95 (90 % HDI 0.77–1.17), is now ×0.96 (0.76–1.18), within 5 % of no change, so the England edition dates no fall (best candidate 2019/20, posterior 10 %). Germany''s fall stays at 2000/01, ×0.75 (90 % HDI 0.64–0.90; was ×0.76, 0.65–0.98), posterior 75 % (was 69 %). Czechia''s fall stays at 2014/15, ×0.59 (0.39–1.02; was ×0.60, 0.39–1.03), and its rise at 2000/01, ×1.67 (0.70–2.32; was ×1.65, 0.87–2.46). Every other dated season is unchanged. In Norway''s backtest the model''s mean error is now 3.4 players, the same as the naive baseline (was 3.2), so the model no longer beats it. The live forecasts move by at most two players; the registered forecasts are unchanged.'
    - 'The Big-5 page of an edition that dates no step (England, Spain) no longer calls its best candidate season a rise or a fall in What this means.'
    - 'The cross-edition change-point fits on the Nations page were refitted under a convergence rule written down before the refit (design/nations-refit-protocol.md): four chains, 2000 tuning steps and 2000 draws, target acceptance 0.95 and 0.99 only where needed; max R-hat at most 1.01, bulk and tail ESS at least 400, no divergent transitions. 15 of 17 fits pass and the page now lists every fit''s diagnostics. Denmark and Switzerland fail (one divergent transition each) and are no longer dated.'
    - 'Dated steps that moved in the refit: Poland''s fall from 2014/15 to 2019/20 (×1.33, 90 % HDI 0.88–1.82) and its other step from 1998/99 to 2014/15; Italy''s other step from 2010/11 to 2009/10. Every other country keeps its seasons with small changes in size. Czechia''s fall stays at 2014/15, ×0.59, but its 90 % HDI widens from 0.38–0.97 to 0.37–1.02 and now includes no change; its rise stays at 2000/01, ×1.67 (0.74–2.40). The edition''s own Big-5 fit, used in the findings, is unchanged.'
  - date: '2026-09-30'
    items:
    - 'The Big-5 chart caption now describes only the dated rules the chart draws in each edition; for Spain, where no step is drawn, it no longer mentions a rise and a fall.'
  - date: '2026-09-29'
    items:
    - 'Checked against editorial standard v1 on 29 September 2026. Pages now carry a research kicker, a metadata block (status: exploratory, not pre-registered; data snapshot; code; cite as; licence), a question-and-contribution
      paragraph with five external references, How to cite and this change log; every question page ends with What this means, What this does not show and a metadata line.'
    - 'Advice drawn from descriptive data was removed: the “A federation tracking this would watch” line on every question, the “For a federation” and “What this is for” blocks, the targets and the “numbers
      to watch” in the findings, and the heuristic sentence under the two reforms, now retitled “Youth minutes in Germany and England after two academy reforms (descriptive)” with Honigstein (2015) and Premier
      League (2011) cited inline.'
    - 'Correction: the per-head count was described as players with at least 450 minutes; it counts every player who appeared (any minutes). The number is unchanged and the page now gives the count at 450
      and 900 minutes beside it (new table per_capita_floors.json, src/international_benchmark.py).'
    - 'Correction: the findings quoted the Big-5 steps from the cross-edition fit (outputs/nations/nations.json, long_run); they now quote the edition’s own change-point fit, the one its Big-5 page shows,
      with the posterior and the 90 % HDI of each step. The claims that a peer’s presence “came back” (resting on posteriors of 23–31 %) were removed.'
    - 'Correction: each Big-5 step is now dated to the season where its own posterior peaks; before, it was the season the step takes in the most probable pair of seasons, which for Spain was 2001/02 (posterior 2 %) where 2021/22 has 7 %. The findings follow the Big-5 page in not dating a step within 5 % of no change, and report an earlier fall as the other step. The method text now says the series starts in 1995/96, not 1990/91, and that the model has two steps.'
    - 'Cross-edition page: every dated step in the long-run chart and table now carries its 90 % HDI (the long run was refitted with the same seed; only the dated seasons of Austria, Belgium, Italy, the Netherlands, Portugal and Spain moved, to their own most probable season). The lines the page generated in the browser, which grouped countries into those that “fell and came back” and asked whether the youth share is “a cause”, were removed; the decomposition bars show their 90 % bootstrap intervals.'
    - 'Correction: the gap decomposition’s league-strength coefficient is negative in the fit; the text now says so (a weaker home league goes with more players per million) instead of reading league strength
      as an advantage. The export-age channel is reported as zero by construction where the countries compared share the same median export age; the two export-age measures are named apart (age at the first
      season abroad; age at the first top-9 season).'
    - 'Correction: the recent youth-minutes finding compared two endpoints; it now reports an OLS slope over the six seasons with its 90 % CI, and the slope at the upper bound of the last season where the
      share is a floor.'
    - 'Stepping-stone leagues are now disjoint from the top nine (config/leagues.yaml: only the German second tier). Every tier rule already checked the top nine first, so no count changed; pathways.json,
      pool_table.json and season_changes.json were recomputed and are identical.'
    - 'New intervals: 90 % percentile-bootstrap intervals on each country’s median minutes share abroad (2 000 resamples, seed 42; pathways.json); interval types are labelled throughout (90 % HDI, 90 % bootstrap
      interval, 90 % CI).'
    - Exhibit C on the pathway page now shows the minutes-share bars and the club goals-scored percentile bars under their own labels; before, only the goals percentile was drawn under a paragraph that led
      with the minutes share.
    - League and club headshots, which carry no licence the atlas can cite, are no longer shown; players without a Wikimedia Commons portrait show initials.
    - 'Methodology: data availability with sources, snapshot dates and licence notes; reproduction commands, snapshot commit and seeds; all limitations in one list; references with access dates, DOIs and
      the data sources (FBref, soccerdata, Wikipedia, Wikidata, Eurostat demo_pjan, UEFA). The review and ruling counts and the build-flow section were replaced by a line on the automated tests; the tracking-data
      demonstration was removed.'
    - 'Reproduction: the rebuild command now includes make figures, which refits the seeded models from the snapshot and redraws the figures; without it a clean clone stopped at the missing figures.'
    - 'Cross-edition page: the decomposition section is retitled from “why a nation lags” to a description of the split, “mechanism” wording is replaced by “channel”, and each contrast is labelled as a gap in players per million.'
