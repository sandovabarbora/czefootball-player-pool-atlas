    - 'Big-5 steps in the findings: 2014/15 ×0.58 and 2000/01 ×1.66 (cross-edition fit) became 2014/15 ×0.60 (90 % HDI 0.39–1.03, posterior 56 %) and 2000/01 ×1.65 (0.87–2.46, posterior 55 %) from the edition’s
