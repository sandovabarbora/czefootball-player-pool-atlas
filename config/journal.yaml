      minutes over 6 seasons: a trend of −0.39 pp a season (90 % CI −1.26 to +0.48).”'
    - Norway’s median age at the first season abroad was printed as 22 (rounding) on the front page; it is 22.5 (n = 60), as on the pathway page.
    - The 2025/26 home under-21 share in the six-season series was printed as 6.3 % (a stored value rounded to four decimals); it is 6.4 %, as everywhere else (floor 6.4 %, upper bound 7.6 %).
    - 'Goalkeepers per million: “rank 5 of 9” became “rank 4–5 of 9”, tied with Slovakia at 0.37.'
    - 'Destinations: the 19 % sideways share is now given as 5 of 27 players, by league: Hungary 3, Austria 1, Switzerland 1.'
    - 'Minutes share abroad: 50 % (3rd of 9 by the median) now carries its 90 % bootstrap interval, 22–66 %, and the note that 8 of the other 8 countries’ intervals overlap it.'
    - 'National-team squad, Exhibit F: “9 squad players have no 2025/26 row” is the total across the five countries; the note now gives it per country.'
    - 'This autumn: publication dates added for Seznam Zprávy (29 June 2026) and Livesport.cz (25 June 2026); the Wikipedia source for the coach’s appointment is marked secondary because the federation’s
      own release was not located; the Czech quotation moved to its footnote.'
