  # ---- findings (počítané jednořádkové poznatky hned za hero)
  findings.h3: "Pět zjištění"
  finding.1: "Hustota na obyvatele řadí český fond na {rank} místo z {n} zemí v peer sadě s {pm} na milion; {top} vede s {top_pm} na milion, {ratio}krát vyšší hustotou.*"
  finding.1.foot: "Zdroj: hustota na obyvatele, § Benchmark vs peer země, soupisky {season}."
  finding.2: "Největší kohortová mezera — {group} {cohort}: {cze} v Česku proti peer mediánu {peer}.*"
  finding.2.foot: "Zdroj: pořadí kohortových mezer, § Benchmark vs peer země."
  finding.3: "Nedávný český export se poprvé dostal na soupisku sledované ligy v mediánovém věku {cze}; dánský v {den}.*"
  finding.3.foot: "Zdroj: Exhibit B — exportní trasa."
  finding.4: "České exporty mají {cze} % klubových minut — {rank} místo z {n} zemí v peer sadě; nejvzdálenější peer, {extreme}, je na {extreme_value} %.*"
  finding.4.foot: "Zdroj: Exhibit C — jak se exportům daří."
  finding.5.squad: "{cze} % nominace {event} hraje za klub top-9 ligy; nejvýš z peer zemí je {peer} s {peer_pct} %.*"
  finding.5.squad.foot: "Zdroj: F · nominace {event} podle ligové úrovně."
  finding.5.sideways: "{share} % českých exportů v zahraničí přešlo do ligy, která není silnější než domácí — boční přesun.*"
  finding.5.sideways.foot: "Zdroj: Exhibit E — kam české exporty míří."
  method.note.title: "Poznámka k metodě — co je přenositelné"
  method.note.body: "Nic v metodě není specifické pro český fotbal: vstupem je kód národnosti (dnes konstanta v několika modulech, zatím ne klíč v configu), sada peer zemí a seznam lig. Spuštěná pro Anglii by vyprodukovala stejné exhibity pro anglické hráče v zahraničí i doma. Její data jsou tabulky FBref v bezplatné úrovni; stejná cesta kódu přijme bohatší event nebo tracking featury jako další sloupce feature vektoru."

  # ---- chapter I
  ch1.framing: "Mapa {n} profesionálů s českou příslušností a kompletní sezónou {season} v lize, kterou pokrývá FBref, rozdělená podle postů a statistického profilu a srovnaná s {peers} peer zeměmi. Metodologický nástroj pro mapování fondu napříč reprezentačním cyklem, ne nominační doporučení."
  ch1.benchmark.h3: "Strukturální benchmark vs peer země"
  ch1.benchmark.p: "Fotbalová intuice zná český fond hráč po hráči. <strong>Jeho strukturální pozice mezi peer zeměmi potřebuje agregaci, kterou nikdo nedrží na jednom místě.</strong> Tři čísla níže se obvykle nesbírají pohromadě."
  ch1.capita.h4: "Hustota hráčů top-{topn} lig na obyvatele (soupisky {season})"
  ch1.capita.aria: "Hustota hráčů top lig na obyvatele podle země"
  ch1.capita.note: "* Čitatel: hráči s národností země podle FBref na soupisce {season} v {topn} hlavních ligách ({leagues}); jmenovatel: populace Eurostat 2024. Česko: {n} hráčů ÷ {pop} mil. = {pm}, pořadí {rank} z {total}."
  ch1.heatmap.alt: "Heatmapa mezinárodního kohortového benchmarku: {n} zemí podle postu a věkové kohorty, sezóna {season}. Každá buňka nese počet hráčů a medián gólů ze hry plus asistencí na 90 minut; česká řada je orámovaná."
  ch1.heatmap.caption: "Medián gólů ze hry + asistencí na 90 minut podle země, postu a věkové kohorty, {season}. Orámovaná řada je Česko; každá buňka ukazuje počet hráčů a medián."
  ch1.cohorts.h4: "Kohortové mezery — {group}"
  ch1.cohorts.th: "Kohorta"
  ch1.cohorts.none: "žádný hráč"
  ch1.cohorts.note: "* Počet a medián npG+A na 90 minut hráčů s národností země v top-{topn} lize, {season}, aspoň {min} minut; kohorta podle věku na kalendářním přelomu sezóny (počáteční rok + 1 − rok narození). Zobrazeno {shown} z {n} zemí; heatmapa výše nese všechny. Největší české propady proti peer mediánu počtu: {gaps}."
  ch1.cohorts.gap_item: "{group} {cohort} ({cze} vs {peer})"
  ch1.atlas.alt: "Dvoupanelový atlas skupiny {group} {season} v PCA projekci. Levý panel: style mapa bez ligových násobiček; pravý panel: kvalitou upravená mapa. Šedé body jsou celý korpus {corpus} hráčů; barevné body jsou {czech} hráčů s českou příslušností podle clusteru; oxbloodové kroužky značí {nt} s reprezentační nominací {nt_years}."
  ch1.atlas.caption: "Atlas skupiny {group} {season} v obou projekcích: {czech} hráčů s českou příslušností barevně proti korpusu {corpus}. Oxbloodové kroužky značí reprezentační fond (nominace {nt_years}, {nt} hráčů)."
  ch1.observations.h3: "Pozorování"
  ch1.clusters.h3: "Cluster archetypy (style projekce)"
  ch1.clusters.p: "Clustery jsou fitované na celém korpusu hráčských sezón {season} a čtené tady přes jejich české členy. Popisek popisuje mediánový otisk clusteru; počet jsou čeští členové korpusového clusteru; jména jsou čeští členové s nejvíc minutami."
  ch1.clusters.meta: "CZE {n} z {corpus} · repre fond {nt} · medián ročníku {born}"
  ch1.clusters.medians: "Mediány korpusu: {npg} gólů ze hry a {ast} asistencí na 90 minut, {share} minut klubu, věk {age}, {cards} karet na 90 minut."
  ch1.clusters.tactical: "Taktické čtení"
  ch1.traj.h3: "Trajektorie {previous} → {metrics} (česká příslušnost, ≥ {min} minut v obou sezónách)"
  ch1.traj.p: "Meziroční změna kvalitou upraveného npG+A na 90 minut. Posun nahoru nebo dolů se počítá nad ± {band}; všechno uvnitř pásma je stabilní a v seznamu není."
  ch1.traj.h4: "{group} — {n} hráčů: {up} nahoru, {stable} stabilně, {down} dolů"
  ch1.traj.up: "Nahoru (Δ npG+A/90, kvalitou upravené)"
  ch1.traj.down: "Dolů (Δ npG+A/90, kvalitou upravené)"
