  # ---- chapter IV
  ch4.aria: "Kapitola IV"
  ch4.title: "Metodologie"
  ch4.synopsis: "Replikovatelná pipeline: zdroje dat, ligové násobičky, bayesovský shrinkage, PCA loadings, analýza citlivosti. Limitace a reprodukovatelnost."
  ch4.h2: "Metodologie"
  ch4.sources.h3: "Zdroje dat"
  ch4.sources.fbref: "<strong>FBref</strong> (přes <code>soccerdata</code>): sezónní tabulky hráčů (standard, playing time) pro {topn} hlavních lig, Chance Ligu, domácí ligy peer zemí a německou druhou ligu; stránka země „Players from Czechia“ pro nalezení fondu; sloupec národnosti pro počty peer zemí"
  ch4.sources.wikipedia: "<strong>Wikipedia</strong>: tabulky reprezentačních nominací ({events}) pro příznak nominace"
  ch4.sources.wikidata: "<strong>Wikidata / Wikimedia Commons</strong>: portréty hráčů (P18) spárované podle jména, občanství a data narození; kredity v patičce"
  ch4.sources.uefa: "<strong>Koeficienty asociací UEFA</strong> (přes Wikipedii) jako zdroj síly lig, ClubElo bylo v době běhu nedostupné"
  ch4.sources.eurostat: "<strong>Eurostat</strong>: odhady populace, 2024"
  ch4.mult.h3: "Ligové násobičky (quality projekce)"
  ch4.mult.th.league: "Liga"
  ch4.mult.th.value: "Násobička"
  ch4.mult.method: "Metoda: <code>{method}</code>. {source} Analýza citlivosti níže ukazuje robustnost pořadí vůči ±20 % na kterékoli jedné násobičce."
  ch4.shrink.h3: "Bayesovský shrinkage"
  ch4.shrink.p1: "Míry na 90 minut u hráčů s málo minutami jsou staženy k mediánu jejich ligy a sezóny (hráči s aspoň {phantom} minutami) empirickým Bayesovým vzorcem, s K = 10 fantomovými zápasy vyjádřenými jako {phantom} minut:"
  ch4.shrink.formula: "shrunk_rate = (události + K × medián_ligy) / (minuty / 90 + K), &nbsp; K = 10"
  ch4.shrink.tex: '\text{{stažená míra}} = \dfrac{{\text{{události}} + K \cdot \text{{medián ligy}}}}{{\text{{minuty}} / 90 + K}},\qquad K = 10'
  ch4.shrink.p2: "Při {min} minutách (vstupní práh) nese medián ligy {weight} váhy; při {phantom} minutách váží vlastní míra hráče a medián stejně. Podíl minut a věk se nestahují."
  ch4.mult.tex: '\text{{npG/90}}_{{\text{{quality}}}} = \text{{npG/90}}_{{\text{{shrunk}}}} \times m_{{\text{{liga}}}}'
  ch4.mult.formula: "npG/90_quality = npG/90_shrunk × m_liga"
  ch4.pca.h3: "PCA loadings"
  ch4.pca.p: "Jeden pětifeaturový vektor na post ({features}), standardizovaný, redukovaný na dvě komponenty na projekci. Style používá stažené míry; quality míry nejdřív násobí ligovou násobičkou."
  ch4.pca.th.group: "Skupina"
  ch4.pca.th.projection: "Projekce"
  ch4.pca.th.variance: "% rozptylu"
  ch4.pca.th.share: "podíl min"
  ch4.pca.th.age: "věk"
  ch4.sens.h3: "Analýza citlivosti (násobičky ±20 %)"
  ch4.sens.p: "Pro každý scénář bylo přepočítáno kvalitou upravené pořadí hráčů s českou příslušností v rámci každého postu a srovnáno se základem; „top-10“ je sjednocení vlastních prvních desítek {groups} skupin ({base} hráčů v základu). Z {n} scénářů {zero} nemění v této množině nikoho; největší churn je {churn}{worst}*."
  ch4.sens.worst: " ({description}, průměrný posun pořadí {delta} v první dvacítce)"
  ch4.sens.th.scenario: "Scénář"
  ch4.sens.th.description: "Popis"
  ch4.sens.th.overlap: "Překryv top-10"
  ch4.sens.th.churn: "Churn top-10"
  ch4.sens.th.delta: "Průměrná Δ pořadí (top 20)"
  ch4.sens.note: "* Churn = členové základní top-10, kteří ve scénáři z množiny vypadnou; průměrná Δ pořadí = průměrná absolutní změna pořadí přes sjednocení základní top-20. Scénáře: základ, každá liga ±20 % zvlášť a všechny ligy ±20 % najednou."
  ch4.dq.h3: "Log kvality dat"
  ch4.dq.p: "Každé rozhodnutí při čištění dat, které změnilo nějaký počet, s tím počtem. První blok je přepočítán při každém běhu; druhý je záznam incidentů (data a počty tak, jak byly zaznamenány)."
  ch4.dq.col.check: "Kontrola"
  ch4.dq.col.count: "Počet"
  ch4.dq.col.what: "Co počítá"
  ch4.dq.recorded: "{n} {unit}, zaznamenáno"
  dq.women_filtered.label: "Odfiltrované ženské položky"
  dq.women_filtered.what: "Položky na stránce země FBref vypuštěné pro příjmení končící na -ová (viz Limitace)."
  dq.namesakes.label: "Jmenovci ve fondu"
  dq.namesakes.what: "Aktivní hráči fondu sdílející normalizované jméno (např. otec a syn), rozlišení podle klubu."
  dq.no_tables.label: "Hráči fondu bez sezónních tabulek"
  dq.no_tables.what: "Čeští profesionálové ze stránky země FBref hrající v lize bez sezónních tabulek, bez jakýchkoli metrik."
  dq.split_seasons.label: "Sloučené rozdělené sezóny"
  dq.split_seasons.what: "Řádky hráč-sezóna-post sloučené do jednoho po přestupu uprostřed sezóny (minuty sečteny, míry vážené minutami)."
  dq.nt_unmatched.label: "Nespárovaná jména z nominací"
  dq.nt_unmatched.what: "Jména z tabulek reprezentačních nominací, která neodpovídají žádnému českému řádku ve featurových tabulkách."
  dq.missing_born.label: "Chybějící ročník narození"
  dq.missing_born.what: "Řádky sezónních tabulek národnosti CZE bez ročníku narození, ze kterých nejde sestavit player_key."
  ch4.lim.h3: "Limitace této analýzy"
  ch4.repro.h3: "Reprodukovatelnost"
  ch4.repro.p: "Celá pipeline je veřejná: <a href=\"{url}\">{url_short}</a>. Licence MIT. Z čistého klonu <code>uv sync &amp;&amp; make restore-snapshot &amp;&amp; make render</code> vykreslí tento report z commitnutého datového snapshotu a <code>make pages</code> sestaví web; <code>make all</code> vše znovu stáhne a spustí celou pipeline. Náhodný seed {seed} pro každý stochastický krok (KMeans). Fetchery cachují surové stránky a jsou idempotentní; krok renderu se nikdy nedotkne sítě."
  ch4.built.h3: "Jak report vznikl"
  ch4.built.p1: "Report vznikl agentním workflow: psaná specifikace návrhu, implementační plán malých úkolů, čerstvý coding agent na každý úkol, po každém kontrola souladu se specifikací a kvality kódu, na konci revize celé větve. Každé rozhodnutí, které controller udělal bez autorky, je datovaný <em>ruling</em> v ledgeru — {n_rulings} pro první edici. Autorka napsala rámec, čtení clusterů a rulingy; agenti napsali kód pod {n_tests} testy."
  ch4.built.flow.spec: "Specifikace"
  ch4.built.flow.plan: "Plán"
  ch4.built.flow.agent: "Task agent"
  ch4.built.flow.review: "Review"
