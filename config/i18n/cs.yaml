  ch4.eda.cleaning.p: "Šest kontrol čištění dat mění syrové řádky výše ve fond použitý ve zbytku reportu, přepočítáno při každém běhu:"
  ch4.eda.cleaning.link: "Celý log, včetně zaznamenaných incidentů pipeline, je v <a href=\"#data-quality\">logu kvality dat</a> níže."
  ch4.eda.features.p: "Každá poziční skupina sdílí stejný pětiprvkový vektor (spec §5): syrový sloupec se stane mírou na 90 minut, staženou k mediánu své ligy a sezóny {cite_efron_morris}, poté vynásobenou projekcí kvality ligy."
  ch4.eda.features.npg_p90.def: "neproměněné penalty goly na 90 minut"
  ch4.eda.features.npg_p90.why: "penalta je kvalita příležitosti, ne produkce ve hře, a nafukuje syrový počet gólů exekutora z důvodů, které nemají nic společného s tím, jak si hráč šance vytváří"
  ch4.eda.features.ast_p90.def: "asistence na 90 minut"
  ch4.eda.features.ast_p90.why: "přímý kreativní doplněk neproměněných penalty gólů, na stejné základní tabulce pro každou ligu v korpusu"
  ch4.eda.features.min_share.def: "odehrané minuty ÷ (zápasy klubu × 90)"
  ch4.eda.features.min_share.why: "vlastní čtení trenéra, spolehlivější než počítání startů (viz níže)"
  ch4.eda.features.age.def: "věk na začátku sezóny (počáteční rok − rok narození)"
  ch4.eda.features.age.why: "mediánová produkce se v tomto korpusu podle věkového pásma stále liší (viz níže), takže zůstává vlastní osou místo toho, aby se do něčeho slévala"
  ch4.eda.features.cards_p90.def: "žluté + 2 × červené karty na 90 minut"
  ch4.eda.features.cards_p90.why: "signál kázně slitý do jedné míry, protože samotné červené karty jsou samy o sobě příliš řídký signál (viz níže)"
  ch4.eda.rejected.p: "Pět kandidátů zvažovaných pro vektor sezóny {season} a co k nim řekla data, napříč celým korpusem (každá dohledaná národnost, stejná populace, kterou popisuje zbytek této kapitoly):"
