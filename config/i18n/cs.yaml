  ch4.strength.h3: "Síla ligy: dva odhady"
  ch4.strength.p1: "Kolik je sezóna {home_league} hodná v přepočtu na Premier League? Násobička UEFA výše odpovídá z kontinentálních výsledků zemí; tento model odpovídá na stejnou otázku od hráčů, kteří ligu skutečně změnili."
  ch4.strength.p1_is_ref: "Kolik je sezóna v ostatních nejsilnějších ligách Evropy hodná v přepočtu na {home_league}? Násobička UEFA výše odpovídá z kontinentálních výsledků zemí; tento model odpovídá na stejnou otázku od hráčů, kteří ligu skutečně změnili."
  ch4.strength.design: "Movers — {players} hráčů pozorovaných aspoň ve dvou ligách napříč {rows} kvalifikujícími hráčskými sezónami — kotví model, protože jen vlastní změna ligy hráče před/po odděluje jeho úroveň od skórovacího prostředí ligy. Hierarchický Poissonův model neproniknutých gólů plus asistencí na 90 minut {cite_bda} fituje efekt ligy a efekt hráče společně, vzorkovaný NUTS {cite_nuts} v PyMC {cite_pymc} a diagnostikovaný ArviZ {cite_arviz}. Partial pooling drží efekty lig regularizované, zatímco efekty hráčů nechává blízko nepoolovaným — stejná within-subject logika, jaká stojí za plus-minus a RAPM hodnocením jinde v týmových sportech {cite_rapm}."
  ch4.strength.fig_alt: "Tečky a 90% HDI modelové násobičky síly ligy m_L za každou ligu, seřazené, s násobičkou UEFA dané ligy jako dutým markerem."
  ch4.strength.home: "V těchto pojmech se sezóna {home_league} přepočítává na {median} sezóny Premier League (90% HDI {lo}–{hi})."
  ch4.strength.home_is_ref: "Jako vlastní referenční bod modelu se {home_league} přepočítává na 1,00 z konstrukce; tabulka níže staví všechny ostatní ligy do těchto pojmů."
