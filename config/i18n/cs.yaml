# Czech copy for the report. Keys mirror src/i18n.py EN (same {placeholders});
# `terms` map English data labels (cluster labels, tiers, country names,
# showcase reasons ...) to Czech. The render fails when an entry is missing.
# Register: sentence case, terse, descriptive — no recommendations.
# Glossary: NT = reprezentace · top-9 ligy · CZE-First League = Chance Liga ·
# stepping stone = odrazová liga · peer countries = peer země.

