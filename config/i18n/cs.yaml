  # ---- hero
  hero.stamp.report: "Report"
  hero.stamp.atlas: "Atlas · {season}"
  hero.stamp.edition: "první vydání · MIT"
  hero.stamp.aria: "Identifikace dokumentu"
  hero.kicker: "Zpravodajství o národním hráčském fondu · veřejná data · reprodukovatelné"
  hero.h2: "Jak hluboký je národní hráčský fond — a proč"
  hero.unit: "hráčů v {topn} nejsilnějších ligách Evropy na milion obyvatel, soupisky {season}"
  hero.lead: "Pohled na profesionální fond jedné země v kvalitě pro federaci: jak si stojí v přepočtu na obyvatele proti peer zemím, kde je děravá jeho vývojová cesta, jak je poskládaná jeho turnajová nominace a jak vypadá sezóna každého hráče proti evropskému korpusu."
  hero.sublead.gap: "Největší kohortová mezera: <strong>{group} {cohort}</strong> — {cze_n} hráčů {cs_gen} v top-{topn} ligách proti peer mediánu {peer}."
  hero.sublead.export: "Nedávný {cs_adj_m} export se poprvé dostal na soupisku top-{topn} ligy v mediánovém věku {cze}; hráč z země {b} v {den}."
  hero.sublead.close: "Postaveno na FBref, Wikipedii a Wikidatech. {cs_Name} je pracovní příklad; pipeline bere kód národnosti a sadu peer zemí. Lidé z fotbalu tato čísla znají hráč po hráči; agregovaná na jednom místě nejsou nikde."
  hero.footnote: "* {n} hráčů s národností {code} podle FBref na soupiskách {season} top-{topn} lig UEFA ÷ {pop} mil. obyvatel (Eurostat 2024); peer země počítány stejně. <a href=\"#methodology\">Metodologie</a>."

  # ---- slidy (Task 13b): devět otázek mezi hero a "pro federaci", každý
  # q (h2) / a (jedna věta, hlavní číslo v <strong>) / proof (jeden exhibit,
  # markup v šabloně) / how (mono řádek zdroje, sdílený štítek "Jak to víme")
  slide.how_label: "Jak to víme"
  slide.1.q: "Je {cs_adj_m} fond tenký?"
  slide.1.a: "{cs_Name} je <strong>{rank} z {n}</strong> zemí s {pm} na milion; {top} vede s {top_pm}."
  slide.1.how: "Odlišní hráči s aspoň {min} minutami na soupiskách {season} v {topn} nejsilnějších ligách ÷ populace (Eurostat 2024); každá země počítána stejně."
  slide.2.q: "Kde přesně?"
  slide.2.a: "Největší kohortová mezera: <strong>{group} {cohort}</strong>, {cze} hráčů {cs_gen} proti peer mediánu {peer}."
  slide.2.how: "Věk na začátku sezóny; kohorty U22 / 23–25 / 26–29 / 30+; aspoň {min} minut."
  slide.3.q: "Dostávají mladí minuty doma?"
  slide.3.a: "Podíl minut domácí ligy pro hráče do 21 let: {cs_name} <strong>{cze_pct} %</strong>, nejlépe {best_name} {best_pct} % (nejlepší peer)."
  slide.3.how: "Podíl všech ligových minut odehraných hráči do 21 let na začátku sezóny, {season}, podle domácí nejvyšší soutěže."
  slide.4.q: "Kam {cs_adj_pl} hráči odcházejí?"
  slide.4.a: "<strong>{abroad} z {total}</strong> hraje v zahraničí; {top9_pct} % v {topn} nejsilnějších ligách, {sideways_pct} % přešlo do strany (do ligy, která není silnější než {cs_adj_f})."
  slide.4.how: "Cílová liga poslední sezóny {season} každého hráče s příslušností {cs_gen}; do strany = násobička cíle ≤ násobička {cs_adj_n} ligy (<a href=\"#league-strength\">síla ligy: dva odhady, § Metodologie</a>).{home_note}"
  slide.5.q: "Jak se jim tam daří?"
  slide.5.a: "{cs_Adj_n} exporty mají medián <strong>{cze} %</strong> minut svého klubu ({rank} z {n})."
  slide.5.how: "Mediánový podíl minut klubu u hráčů v zahraničí, podle země původu (<a href=\"#league-strength\">síla ligy: dva odhady, § Metodologie</a>).{home_note}"
  ch2.headline_note: "Pro tuto zemi nevypovídající: {home_league} i domácí ligy všech peer zemí jsou samy top-{topn} ligami, takže dělení domácí / top-{topn} tu nemá obsah; exhibit je ponechaný kvůli srovnatelnosti s jinými zeměmi."
  slide.home_note: " {cs_home_league} je sama jednou z {topn} nejsilnějších lig Evropy; „v zahraničí“ tu znamená ostatních {topn_minus_1}."
  slide.6.q: "Z čeho je postavená nominace na MS?"
  slide.6.a: "<strong>{cze_pct} %</strong> nominace {event} hraje v {topn} nejsilnějších ligách; {best_name} {best_pct} %."
  slide.6.how: "Soupisky z Wikipedie spárované s ligovými řádky sezóny {season}; úroveň = liga řádku s nejvíc minutami."
  slide.7.q: "Kdy vlak odjel?"
  slide.7.a: "{cs_Adj_pl} hráči s aspoň {min} minutami v ligách Big-5 vyvrcholili na <strong>{peak_n}</strong> v sezóně {peak_season}, klesli na {low_n} v {low_season}, {last_n} v {last_season}."
  slide.7.how: "Sezónní tabulky hráčů Big-5 z FBref {first_season} → {last_season}; peer země podle stejného pravidla; jména jsou {cs_adj_pl} hráči s nejvíc minutami z každé vrcholné sezóny včetně brankářů — sestava přítomnosti, ne žebříček kvality: {golden}."
  slide.7.alt: "Čárový graf: {cs_adj_pl} hráči s aspoň {min} minutami v ligách Big-5, {start} až {end}, proti osmi peer zemím; spodní panel ukazuje hráče na milion obyvatel pro {cs_name}, {a} a {b}."
  slide.8.q: "Jak to dělají {a} a {b}?"
  slide.8.a: "Na stejných šesti číslech dává {a} hráčům do 21 let <strong>{nor_u21} %</strong> domácích minut proti {cze_u21} % a posílá {nor_top9} % nominace do {topn} nejsilnějších lig proti {cze_top9} %."
  slide.8.how: "Stejné definice, stejné sezóny; srovnání, ne kauzální tvrzení."
  slide.8b.q: "Kde to funguje: brankáři?"
  slide.8b.a: "{n_gk} {cs_adj_pl} brankáři hrají aspoň {min} minut v top-{topn} ligách ({pm} na milion, pořadí <strong>{rank} z {n}</strong>); v nich se poprvé objevili v mediánovém věku {gk_age}, oproti {out_age} u exportů z pole."
  slide.8b.alt: "Bodový graf věku při prvním startu v top-9 lize, {cs_adj_pl} brankáři proti exportům z pole, jeden bod na hráče, medián vyznačen."
  slide.8b.how: "Práh {min} minut, soupisky {season}, stejné stahování K = {phantom} jako zbytek reportu; první sezóna ve stažené top-{topn} tabulce; hráči, kteří v ní byli už v {history_start}, jsou cenzurovaní — {censored_pct} % brankářů, {censored_out_pct} % exportů z pole; srovnání dvou cest v rámci jednoho národa, ne kauzální tvrzení.{home_note}"
  slide.8b.home_note: " Brankáři z ligy {cs_home_league} nemusí kvůli první sezóně v top-{topn} lize nikam přestupovat."
  slide.9.q: "Kdo to je?"
  slide.9.a: "<strong>{n} karet</strong> vybraných šesti pravidly."
  slide.9.how: "Řádky FBref, Wikipedie a Wikidat sezóny {season} spojené podle jména a ročníku narození; šest výběrových pravidel, v tomto pořadí — viz níže."

