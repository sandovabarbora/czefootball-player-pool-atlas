  ch4.eda.rejected.note: "Navzdory vysoké korelaci se góly a neproměněné penalty goly rozcházejí u hráčů, kteří proměňují penalty: {top3}. Starty (mp) korelují s minutami silně, ale ne dokonale — náhradnický vstup se počítá stejně jako 90 odehraných minut, a proto tady čas na hřišti měří podíl minut, ne starty. Medián gólů + asistencí na 90 min podle věkových pásem jde od {age_range}."
  ch4.eda.fig1.alt: "Malé násobky: rozdělení pěti syrových příznaků na 90 minut podle ligy, boxploty na ligu, {cs_home_league} zvýrazněná, zobrazeno {n} lig."
