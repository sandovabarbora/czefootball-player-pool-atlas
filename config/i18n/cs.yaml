  ch2.b.h3: "Exhibit B — exportní trasa"
  ch2.b.p: "Pro každého hráče peer země na soupisce top-{topn} ligy {current}: věk v první sezóně v top-{topn} lize (celá soupiska a jen nedávní příchozí) a u nedávných příchozích liga sezóny před ní."
  ch2.b.cze: "České exporty: {n} hráčů, mediánový věk exportu {age} (nedávní příchozí {n_recent}, medián {age_recent}), {domestic} nedávných přímo z Chance Ligy*."
