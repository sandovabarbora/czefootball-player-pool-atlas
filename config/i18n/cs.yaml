  # ---- footer
  foot.kicker: "Football intelligence konzultantka"
  foot.body: "Data science, video tracking a taktické čtení hry v jedné metodě. Pracuji s veřejnými statistickými zdroji evropských profesionálních lig a kombinuji je se strukturálním pohledem na hráčský fond, skautskými signály a roadmapou pro fotbalovou analytiku. Metodologie, kód i data této analýzy jsou veřejné a reprodukovatelné."
