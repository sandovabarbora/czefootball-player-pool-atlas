  ch4.strength.oos.method.uefa: "Míra × poměr UEFA"
  ch4.strength.oos.method.model: "Model"
  ch4.strength.spearman: "Na {n} společných ligách korelují modelové mediány a násobičky UEFA se Spearmanovým rho = {rho}."
  ch4.strength.disagreement: "{league}: pořadí modelu {model_rank} vs. pořadí UEFA {uefa_rank} (m_L {model_median} vs. násobička {uefa})."
  ch4.strength.diagnostics: "R-hat ≤ {rhat}, minimální bulk ESS {ess}, {div} divergentních tranzicí napříč {rows} hráčskými sezónami od {players} moverů; fit za {runtime} s."
  ch4.strength.selection: "Co movers neukazují: nejsou náhodný vzorek — hráči obvykle odcházejí nahoru, když jsou dobří, a dolů, když stárnou — takže vnitrohráčský kontrast popisuje rozdíl lig pro typ hráče, který ligu mění, a věkový člen absorbuje jen tu část selekce, která je věk. Interval je nejistota modelu, ne selekce."
  ch4.strength.ranking: "Žebříčky reportu drží násobičku UEFA koeficientu po celou dobu; model výše je ukázaný vedle ní jako kontrola vlastního předpokladu té násobičky — že kontinentální výsledky sledují sílu hráčů — ne jako její náhrada."
  ch4.strength.ppc.summary: "Posteriorní prediktivní kontrola"
  ch4.strength.ppc.p: "Pozorované vs. replikované neproniknuté góly plus asistence na hráčskou sezónu {cite_ppc}: podíl nul {obs_zero} vs. {rep_zero}, průměr {obs_mean} vs. {rep_mean}, 90. percentil {obs_p90} vs. {rep_p90}."
  ch4.strength.ppc.fig_alt: "Sloupcový graf porovnávající pozorované a posteriorně-prediktivně replikované rozdělení neproniknutých gólů plus asistencí na hráčskou sezónu, seskupené 0/1/2/3/4/5+."

  ch4.compare.h3: "Tři modely, jeden úkol, pět sezón"
  ch4.compare.q: "Co nám sezóna hráče řekne o té příští, s ohledem na to, kde hraje, kolik mu je a — u exportů — v jakém věku odešel? V modelovém vyjádření: predikovat hráčovu ligou upravenou produkci v příští sezóně (neproniknuté góly plus asistence na 90 minut, upravené o kvalitu) z čísel této sezóny, pro každou hráčskou sezónní dvojici s aspoň {min} minutami v obou sezónách, každou národnost v korpusu."
  ch4.compare.design: "Vyhodnoceno rolling-origin křížovou validací {cite_ro}: pro každou z {n_origins} cílových sezón po řadě trénuje každý model jen na dvojicích, jejichž cílová sezóna přišla dřív, a je testován na dvojicích té sezóny — stejná disciplína, jakou používá prognostik, když je budoucnost v době fitu opravdu neznámá, a to, co dělá tabulku níže po sezónách skutečným čtením „výkonu v čase“, ne jedním smíšeným číslem. Dvě základní linie — persistence (příští sezóna = tato sezóna) a shrinkage k ligovému průměru — stojí vedle tří fitovaných modelů se stejnými osmi rysy: hierarchická bayesovská regrese (target ~ Normal(μ, σ), partial pooling na lize a hráči, NUTS, {chains} řetězce × {draws} vzorků na origin {cite_bayes}), gradient-boosted regresor a malý vícevrstvý perceptron (scikit-learn {cite_sklearn}, skryté vrstvy 64/32 — malý MLP, ne embedding model: PyTorch není součástí tohoto pipeline). Trénovací řádky bayesovského modelu jsou subsamplované na nejvýš {max_train} na origin, aby se fity pěti origins vešly do rozpočtu běhu; ostatní čtyři modely trénují na plném splitu. Cíl je upravený násobičem ligy, ve které hráč hraje příští sezónu; featury znají jen letošní ligu, takže přestup je změna, kterou žádný z modelů nevidí dopředu — omezení společné všem pěti."
  ch4.compare.fig_alt: "Čárový graf RMSE za cílovou sezónu, jedna čára na model, persistence přerušovaně."
  ch4.compare.th.model: "Model"
  ch4.compare.th.pooled: "Souhrn"
  ch4.compare.model.persistence: "Persistence"
  ch4.compare.model.shrinkage_league_mean: "Shrinkage k ligovému průměru"
  ch4.compare.model.bayesian: "Hierarchický bayesovský"
  ch4.compare.model.gbm: "Gradient boosting"
  ch4.compare.model.mlp: "Malý MLP"
  ch4.compare.note: "Každá buňka: RMSE (MAE), v ligou upravených npG+A na 90 minut. Trénovací množina první origin je prázdná z konstrukce — nejstarší sezóna s rysy v korpusu nemá dřívější cílovou sezónu, na které by se dalo trénovat — proto jsou u ní uvedené jen dvě základní linie."
  ch4.compare.coverage: "90% predikční interval bayesovského modelu pokryl pozorovanou hodnotu {pooled} případů, souhrnně napříč {n} origins, na které byl fitovaný ({per_origin})."
  ch4.compare.winner: "Podle souhrnného RMSE vyhrává {winner} ({rmse} vs. {persistence_rmse} u persistence, o {margin} nižší)."
  ch4.compare.drift: "Nejvýraznější posun RMSE vítěze mezi sezónami je mezi {from} a {to} ({value}) — přesně ten typ driftu, který tato rolling-origin tabulka má odhalit."

  ch4.validation.h3: "Validace a robustnost"
  ch4.validation.stub: "Každý model v tomto pipeline nese vlastní validaci hned vedle svého popisu; tato sekce sbírá jednu hlavní diagnostiku od každého, jak přibývá. Zatím:"
  ch4.validation.m1: "Srovnání modelů mezi sezónami (M1): rolling-origin vyhodnocení přes {n_origins} sezón, souhrnné RMSE favorizuje {winner} ({rmse} vs. {persistence_rmse} u persistence), 90% interval bayesovského modelu pokryl {coverage} pozorovaných hodnot."
  ch4.validation.m2: "Síla ligy (M2): R-hat ≤ {rhat}, {div} divergentních tranzicí, out-of-sample log prediktivní hustota favorizuje „{oos_winner}“ ({oos_logpd}), Spearmanovo rho = {rho} proti násobičkám UEFA."

