  ch2.c.h3: "Exhibit C — jak se exportům daří"
  ch2.c.p: "Hráči peer zemí v klubu top-{topn} ligy v sezóně {season}: mediánový podíl minut klubu a síla klubu v rámci jeho ligy."
  ch2.c.cze: "České exporty hrají medián <strong>{share}</strong> minut svého klubu ({rank_min} z {n_min}) za kluby na {goals} percentilu vstřelených gólů své ligy ({rank_goals} z {n_goals})*."
  ch2.c.h4.min: "Mediánový podíl minut v klubu top-{topn} ligy"
  ch2.c.aria.min: "Mediánový podíl minut exportů v jejich klubu podle země"
  ch2.c.h4.goals: "Mediánová síla klubu: percentil vstřelených gólů v rámci ligy"
  ch2.c.aria.goals: "Mediánový percentil vstřelených gólů klubů exportů podle země"
  ch2.c.note: "* Podíl minut = minuty hráče ÷ (zápasy klubu × 90), {season}, jedna řádka na hráčskou sezónu. Proxy síly klubu: {proxy} — kluby seřazené podle gólů, které jejich vlastní soupiska v sezóně vstřelila (ClubElo bylo v době běhu nedostupné). Obojí jsou mediány přes exporty země; n na zemi ve sloupcích."
  ch2.d.h3: "Exhibit D — profil těch, kteří to dokázali"
