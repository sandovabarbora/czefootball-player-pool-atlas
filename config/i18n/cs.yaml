  ch1.traj.th.league: "Liga"
  ch1.traj.th.min: "Min {previous} / {metrics}"
  ch1.traj.none_up: "Žádný český hráč se neposunul nahoru nad pásmo."
  ch1.traj.none_down: "Žádný český hráč se neposunul dolů pod pásmo."
  ch1.continue: "Následují cesty do zahraničí; karty, analogy a metodologie přijdou po nich"

  # ---- chapter II
  ch2.aria: "Kapitola II"
  ch2.title: "Odkud odjíždí vlak"
  ch2.synopsis: "Čtyři exhibity o cestě z domácí ligy na soupisku top-{topn} ligy: minuty pro vlastní hráče do 21 let, věk a dveře exportu, jak se exportům daří v novém klubu a produkční profil podle úrovně. Každý jmenuje rozdíl; žádný nejmenuje lék."
  ch2.framing: "Cesty a rozdíly mezi Českem a {n} peer zeměmi, spočítané ze stejných ligových tabulek: expozice doma, exportní trasa, jak se exportům daří a profil těch, kteří to dokázali."
  ch2.a.h3: "Exhibit A — expozice mládeže doma"
  ch2.a.p: "Podíl celkových minut domácí ligy odehraných vlastními hráči do 21 let včetně, {season}."
  ch2.a.cze: "Chance Liga dává <strong>{share}</strong> svých minut českým hráčům do 21 let, {rank} z {n} lig s daty*; {top} vede s {top_share}."
  ch2.a.aria: "Podíl minut domácí ligy odehraných vlastními hráči do 21 let"
