  ch4.eda.fig2.alt: "Rozptylový graf syrových vs. stažených neproměněných penalty gólů na 90 minut proti minutám pro hráče s příslušností {cs_gen}, s překrytou váhou stažení k ligovému mediánu jako funkcí minut."
  ch4.eda.fig2.caption: "Co stažení udělá s hráčem s málo minutami: na vstupním prahu nese ligový medián stále většinu váhy; míra hráče {player} se posunula nejvíc ze všech hráčů {cs_gen} tuto sezónu."

  ch4.mult.h3: "Ligové násobičky (quality projekce)"
  ch4.mult.th.league: "Liga"
  ch4.mult.th.value: "Násobička"
  ch4.mult.method: "Metoda: <code>{method}</code>. {source} Analýza citlivosti níže ukazuje robustnost pořadí vůči ±20 % na kterékoli jedné násobičce."
  ch4.shrink.h3: "Bayesovský shrinkage"
  ch4.shrink.p1: "Míry na 90 minut u hráčů s málo minutami jsou staženy k mediánu jejich ligy a sezóny (hráči s aspoň {phantom} minutami) empirickým Bayesovým vzorcem {cite_efron_morris}, s K = 10 fantomovými zápasy vyjádřenými jako {phantom} minut:"
  ch4.shrink.formula: "shrunk_rate = (události + K × medián_ligy) / (minuty / 90 + K), &nbsp; K = 10"
  ch4.shrink.tex: '\text{{stažená míra}} = \dfrac{{\text{{události}} + K \cdot \text{{medián ligy}}}}{{\text{{minuty}} / 90 + K}},\qquad K = 10'
  ch4.shrink.p2: "Při {min} minutách (vstupní práh) nese medián ligy {weight} váhy; při {phantom} minutách váží vlastní míra hráče a medián stejně. Podíl minut a věk se nestahují."
  ch4.gk.p: "Brankářské míry (protipříklad z kapitoly II) používají stejný vzorec. Obdržené góly/90 a zákroky/90 se stahují k mediánu ligy a sezóny se stejným K = {phantom} minut a obdržené góly/90 jsou pak upravené o násobičku ligy — obdržený gól v silnější lize se počítá méně. Úspěšnost zákroků se stahuje stejně, ale proti počtu střel na bránu, ne minutám: počet střel za jednu sezónu je zpravidla hluboko pod K = {phantom}, takže save_pct_shrunk se u téměř každého brankáře stáhne blízko k mediánu ligy — vypovídavější je tam velký rozdíl v syrové, nestažené úspěšnosti zákroků."
  ch4.mult.tex: '\text{{npG/90}}_{{\text{{quality}}}} = \text{{npG/90}}_{{\text{{shrunk}}}} \times m_{{\text{{liga}}}}'
  ch4.mult.formula: "npG/90_quality = npG/90_shrunk × m_liga"
  ch4.pca.h3: "PCA loadings"
  ch4.pca.p: "Jeden pětifeaturový vektor na post ({features}), standardizovaný, redukovaný na dvě komponenty na projekci. Style používá stažené míry; quality míry nejdřív násobí ligovou násobičkou."
