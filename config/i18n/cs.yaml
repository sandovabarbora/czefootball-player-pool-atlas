  # ---- chapter I
  ch1.benchmark.h3: "Strukturální benchmark vs peer země"
  ch1.benchmark.p: "Fotbalová intuice zná {cs_adj_m} fond hráč po hráči. <strong>Jeho strukturální pozice mezi peer zeměmi potřebuje agregaci, kterou nikdo nedrží na jednom místě.</strong> Tři čísla níže se obvykle nesbírají pohromadě."
  ch1.capita.aria: "Hustota hráčů top lig na obyvatele podle země"
  ch1.heatmap.alt: "Heatmapa mezinárodního kohortového benchmarku: {n} zemí podle postu a věkové kohorty, sezóna {season}; {cs_adj_f} řada je orámovaná."
  ch1.heatmap.caption: "Medián gólů ze hry + asistencí na 90 minut podle země, postu a věkové kohorty, {season}; orámovaná řada je {cs_name}."
  ch1.heatmap.note: "Každá buňka: počet hráčů a medián; řady seřazené podle pořadí na obyvatele, {cs_name} zvýrazněné."
  ch1.cohorts.h4: "Kohortové mezery — {group}"
  ch1.cohorts.th: "Kohorta"
  ch1.cohorts.none: "žádný hráč"
  ch1.cohorts.note: "* Počet a medián npG+A na 90 minut hráčů s národností země v top-{topn} lize, {season}, aspoň {min} minut; kohorta podle věku na kalendářním přelomu sezóny (počáteční rok + 1 − rok narození). Zobrazeno {shown} z {n} zemí; heatmapa výše nese všechny. Největší {cs_adj_n} propady proti peer mediánu počtu: {gaps}."
  ch1.cohorts.gap_item: "{group} {cohort} ({cze} vs {peer})"
  ch1.atlas.alt: "Dvoupanelový atlas skupiny {group} {season} v PCA projekci. Levý panel: style mapa bez ligových násobiček; pravý panel: kvalitou upravená mapa. Šedé body jsou celý korpus {corpus} hráčů; barevné body jsou {czech} hráčů s příslušností {cs_gen} podle clusteru; oxbloodové kroužky značí {nt} s reprezentační nominací {nt_years}."
  ch1.atlas.caption: "Atlas skupiny {group} {season} v obou projekcích: {czech} hráčů s příslušností {cs_gen} barevně proti korpusu {corpus}. Oxbloodové kroužky značí reprezentační fond (nominace {nt_years}, {nt} hráčů)."
  ch1.observations.h3: "Pozorování"
  ch1.clusters.h3: "Cluster archetypy (style projekce)"
  ch1.clusters.p: "Clustery jsou fitované na celém korpusu hráčských sezón {season} a čtené tady přes jejich {cs_adj_n} členy, K vybrané podle silhouette skóre {cite_rousseeuw} pomocí scikit-learn {cite_pedregosa}. Popisek popisuje mediánový otisk clusteru; počet jsou {cs_adj_pl} členové korpusového clusteru; jména jsou {cs_adj_pl} členové s nejvíc minutami."
  ch1.clusters.meta: "{code} {n} z {corpus} · repre fond {nt} · medián ročníku {born}"
  ch1.clusters.medians: "Mediány korpusu: {npg} gólů ze hry a {ast} asistencí na 90 minut, {share} minut klubu, věk {age}, {cards} karet na 90 minut."
  ch1.clusters.tactical: "Taktické čtení"
  ch1.traj.h3: "Trajektorie {previous} → {metrics} ({cs_adj_f} příslušnost, ≥ {min} minut v obou sezónách)"
  ch1.traj.p: "Meziroční změna gólů + asistencí na 90 minut, upravených o ligu. Posun nahoru nebo dolů se počítá nad ± {band}; všechno uvnitř pásma je stabilní a v seznamu není."
  ch1.traj.h4: "{group} — {n} hráčů: {up} nahoru, {stable} stabilně, {down} dolů"
