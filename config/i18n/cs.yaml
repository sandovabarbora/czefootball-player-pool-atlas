  # ---- chapter III
  ch3.aria: "Kapitola III"
  ch3.title: "Karty a analogy"
  ch3.synopsis: "{n} karet hráčů vybraných pravidly, ne výběrem — za každý post nejvyšší kvalitou upravené npG+A na 90 minut, nejmladší reprezentační nominace, nejvíc minut v top-{topn} ligách a nejvíc domácích minut mezi hráči do 23 let bez sezóny v top-{topn} lize — každá spojuje statistiky, umístění v clusteru, taktické čtení, trajektorii a nejbližší historické analogy ve stejném věku z korpusu všech národností."
  ch3.cards.h2: "Karty hráčů"
  ch3.cards.framing: "Jedna integrovaná karta na hráče, jedna řada na výběrové pravidlo: produkce {metrics}, umístění v clusteru v obou projekcích, taktické čtení clusteru, trajektorie {previous} → {metrics} a {n} nejbližší analogy. Klub na řádku se jménem je klub {current}; blok statistik je {metrics}. Popis, ne predikce."
  ch3.cards.rules: "Proč tyto karty: jedna karta na post na pravidlo, v tomto pořadí — (a) nejvyšší kvalitou upravené npG+A na 90 minut, (b) nejmladší reprezentační nominace, (c) nejvíc minut v top-9 ligách mezi nominovanými na {event}, (d) nejvíc minut v top-9 ligách, (e) nejvíc domácích minut do 23 let bez sezóny v top-9 lize. Hráč vybraný dřívějším pravidlem propadá na další jméno, takže pozdější řada může ukázat druhé jméno podle svého měřítka."
  ch3.card.nt: "reprezentace {nt_years}"
  ch3.card.latest_known: "poslední známý"
  ch3.card.stat.q: "npG+A/90 quality"
  ch3.card.stat.rates: "npG / A na 90"
  ch3.card.stat.min: "Minuty"
  ch3.card.style: "style"
  ch3.card.quality: "quality"
  ch3.card.tactical: "Taktické čtení"
  ch3.card.traj: "Trajektorie {previous} &rarr; {metrics}"
  ch3.card.analogs: "Historické analogy ve věku {age}"
  ch3.card.min: "min"
  ch3.card.selected: "Vybrán jako: {reason}."
  ch3.cards.note: "* Každá karta vykresluje existující dataset; žádný výpočet nad rámec spojení. Věk na řádku se jménem je věk na začátku sezóny {current} (rok začátku − rok narození); klub je z tabulek {current}, nebo — označený „{latest}“ — ze stránky země na FBref, kde hráč nemá řádku {current}. Věk na řádku analogu sleduje konvenci hledače analogů (rok začátku sezóny + 1 − rok narození)."
  ch3.analogs.h3: "Historické analogy"
  ch3.analogs.p: "Pro každého hráče z karet bere hledač {n} nejbližších hráčských sezón ve stejném věku napříč celým korpusem všech stažených lig — {topn} hlavních lig zpět do {start}, ostatní od {coverage} — všechny národnosti. Vzdálenost se počítá na třech standardizovaných featurách: <code>npG+A/90 (kvalitou upravené)</code>, <code>minuty</code>, <code>ligová násobička</code>. U každého analogu jsou následující sezóny zobrazené tak, jak se staly. <strong>Popis, ne predikce</strong>: čtenář vidí rozptyl cest; metoda žádnou nevnucuje."
  ch3.analogs.target: "Cíl"
  ch3.analogs.age: "věk"
  ch3.analogs.target_stats: "{group} &middot; věk {age} &middot; {league} {season} &middot; {min} min &middot; {q} npG+A/90 quality"
  ch3.analogs.cohort: "{n} nejbližších ve stejném věku"
  ch3.analogs.row: "{league} {season} &middot; {min} min &middot; {q} npG+A/90 &middot; d&nbsp;=&nbsp;{d}"
  ch3.analogs.followed: "Pokračování:"
  ch3.analogs.none: "Žádná pozdější sezóna v korpusu."
  ch3.analogs.note: "* Korpus: hráčské sezóny s aspoň {min} minutami v kterékoli stažené lize — hlavní ligy {start} → {current}, ostatní ligy {coverage} → {current}; vlastní sezóny cíle jsou vyloučené. Cesta, která končí brzy, znamená, že hráč opustil pokryté ligy, ne že skončila kariéra."

