  ch4.eda.intro: "Jedna hráčská sezóna {season}, sledovaná od syrového řádku z FBref až k pětiprvkovému vektoru, na kterém stojí zbytek této kapitoly: {player}, hráč {cs_gen} s nejvíce minutami v sezóně {season} mezi těmi, kdo prošli vstupním prahem."
