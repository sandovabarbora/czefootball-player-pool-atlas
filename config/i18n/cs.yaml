  ch4.sources.fbref: "<strong>FBref</strong> (přes <code>soccerdata</code>): sezónní tabulky hráčů (standard, playing time) pro {topn} hlavních lig, ligu {cs_home_league}, domácí ligy peer zemí a německou druhou ligu; stránka země „Players from {nation}“ pro nalezení fondu; sloupec národnosti pro počty peer zemí"
