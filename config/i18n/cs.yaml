  ch4.aria: "Kapitola IV"
  ch4.title: "Jak je to postavené, validované a kde to končí"
  ch4.synopsis: "Replikovatelná pipeline: zdroje dat, ligové násobičky, bayesovský shrinkage, PCA loadings, analýza citlivosti. Limitace a reprodukovatelnost."
