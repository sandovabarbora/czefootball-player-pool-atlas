  # ---- generated: limitations
  lim.leagues.title: "Ligy bez metrik"
  lim.leagues.body: "Pipeline stahuje z FBref {n_leagues} soutěží; česká druhá liga a slovenská nejvyšší soutěž na FBref vůbec nejsou. {n_no_tables} z {n_pool} českých profesionálů nalezených na stránce země FBref hraje v lize bez sezónních tabulek a nenese žádné metriky; jsou uvedeni jen jménem a klubem. Slovenské exhibity v kapitole II proto stojí na jeho hráčích v zahraničí."
  lim.features.title: "Featury z bezplatné vrstvy"
  lim.features.body: "Vektor featur je pět základních sloupců na 90 minut: góly ze hry, asistence, podíl minut, věk a karty. Žádné očekávané góly, žádné progresivní přihrávky, žádné skluzy — pravidlem byl jeden identický vektor napříč každou ligou korpusu a pro všechny je dostupná jen základní tabulka. Defenzivní a kreativní příspěvek nad rámec asistencí je pro mapu neviditelný."
  lim.nt.title: "Zdroj reprezentačního příznaku"
  lim.nt.body: "Příznak „nominován {nt_years}“ je parsovaný z tabulek nominací na Wikipedii ({nt_events}) a spárovaný podle normalizovaného jména a ročníku narození. Nese ho {n_nt_flagged} z {n_with_metrics} zmapovaných hráčů. Editace tabulky nebo varianta jména může nominaci vypustit; příznak je štítek, ne počet startů."
  lim.photos.title: "Pokrytí fotografiemi"
  lim.photos.body: "{n_photos} z {n_pool} hráčů fondu má portrét z Wikimedia Commons (Wikidata P18, spárováno podle jména, občanství a data narození, povolání filtrováno na fotbalistu), použitý na webu. Hráči bez portrétu mají na webu iniciály."
  lim.seasons.title: "Rozdělení sezón"
  lim.seasons.body: "Hlavní počet na obyvatele i každá metrika používají kompletní sezónu {metrics}; trajektorie běží {previous} → {metrics}; klub na kartě je klub {current} (sezóna probíhající v době sestavení)."
  lim.multipliers.title: "Ligové násobičky"
  lim.multipliers.body: "ClubElo bylo v době běhu nedostupné, takže násobičky jsou koeficienty asociací UEFA škálované na nejsilnější ligu = {max_multiplier} a druhé ligy jsou předpokladem nastaveny na {tier2_factor} × první liga téže země. Proxy síly klubu v kapitole II je percentil vstřelených gólů klubu v rámci jeho ligy, ne Elo rating. Tabulka citlivosti ukazuje, jak daleko chyba ±20 % v kterékoli jedné násobičce posune české pořadí."
  lim.origins.title: "Původ exportů jen z nedávných příchozích"
  lim.origins.body: "Liga původu exportu je známá jen tehdy, když byla stažena sezóna před první sezónou v top-9 lize: od {history_start} pro hlavní ligy, od {coverage_start} pro domácí ligy peer zemí. Podíly původu a věk nedávného exportu se proto počítají přes hráče, jejichž první sezóna v top-9 lize je {metrics} nebo {current}; dřívější příchozí se počítají do celkového věku exportu, ale ne do mixu původu, a první výskyt už v {history_start} je cenzurovaný (cenzurovaný podíl je zobrazený)."
  lim.identity.title: "Identita hráče"
  lim.identity.body: "Sezónní tabulky FBref nenesou id hráče, takže hráči se spojují podle normalizovaného jména a ročníku narození napříč ligami a sezónami; dva hráči sdílející obojí by se sloučili do jednoho. Přestup uprostřed sezóny vytvoří dvě klubové řádky, které se před řazením sloučí do jedné vážené minutami."
  lim.women.title: "Ženské položky a heuristika -ová"
  lim.women.body: "Stránka země FBref míchá mužské a ženské soutěže. Položky s příjmením končícím na -ová byly z fondu vypuštěny; žena s jinou koncovkou příjmení by filtrem prošla a muž s touhle koncovkou ne."
  lim.scope.title: "Žádné tržní hodnoty, žádný skauting"
  lim.scope.body: "Přestupové částky, tržní hodnoty, video a skautské zprávy jsou mimo zde použité veřejné zdroje. Mapa popisuje statistické otisky a počty; nominační a rozvojová rozhodnutí vyžadují vlastní data a expertizu svazu, které tato metoda nemá."
  lim.tracking.title: "Žádná eventová ani trackingová data"
  lim.tracking.body: "Každá featura tady je sezónní agregát z bezplatných tabulek FBref. Trackingová práce autorky žije jinde: <a href=\"https://github.com/sandovabarbora/tactical-cz\">tactical-cz</a> (sledování hráčů z broadcast videa pro český fotbal) a hokejový video PoC odkazovaný z <a href=\"https://hockey.datasimply.eu\">hockey.datasimply.eu</a>."

