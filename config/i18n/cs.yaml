  ch4.strength.oos.p: "Přefitovaný na sezóny před {season} model predikuje první řádek {season} každého movera po změně ligy — {n} takových přesunů — proti dvěma základním liniím: stejná míra jako předtím a tato míra škálovaná poměrem násobiček UEFA. Je to stejná populace, jakou sledují měsíční reporty expatriotských hráčů CIES Football Observatory {cite_cies}."
